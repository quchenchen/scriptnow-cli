[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scriptnow-cli"
version = "0.1.0"
description = "ScriptNow 创作 CLI —— 从灵感到成书交付的一站式命令行（CLI-Anything 模式）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ScriptNow" }]
keywords = ["scriptnow", "novel", "script", "cli", "agent", "cli-anything"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Text Processing",
]
dependencies = [
    "click>=8.0",
    "requests>=2.28",
]

[project.scripts]
scriptnow = "cli_anything.scriptnow.scriptnow_cli:main"

[tool.setuptools]
packages = ["cli_anything", "cli_anything.scriptnow", "cli_anything.scriptnow.utils"]

[tool.setuptools.package-data]
"cli_anything.scriptnow" = ["skills/SKILL.md", "README.md"]
