[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scriptnow-cli"
dynamic = ["version"]
description = "ScriptNow 创作 CLI —— 从灵感到成书交付的一站式命令行（CLI-Anything 模式）"
readme = "README.pypi.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ScriptNow" }]
keywords = ["scriptnow", "novel", "script", "cli", "agent", "cli-anything"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Text Processing",
]
dependencies = [
    "click>=8.0",
    "requests>=2.28",
]

[project.urls]
Homepage = "https://sn.igeewa.com"
Documentation = "https://sn.igeewa.com/cli"
Repository = "https://github.com/quchenchen/scriptnow-cli"
Issues = "https://github.com/quchenchen/scriptnow-cli/issues"

[project.scripts]
scriptnow = "cli_anything.scriptnow.scriptnow_cli:main"

[tool.setuptools]
packages = ["cli_anything", "cli_anything.scriptnow", "cli_anything.scriptnow.utils"]

[tool.setuptools.package-data]
"cli_anything.scriptnow" = ["skills/SKILL.md", "skills/references/*.md", "skills/agents/*.yaml", "README.md"]

[tool.setuptools.dynamic]
version = { attr = "cli_anything.scriptnow.__version__" }
